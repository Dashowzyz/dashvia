  <main class="conteudo">
    <header class="topo-centralizado">
      <h1>Configurações</h1>
      <p>Gerencie seu perfil</p>
    </header>

    <section class="perfil">
      <div id="avatar" class="avatar"></div>
      <div class="acoes-foto">
        <button type="button" class="link-foto" id="btn-foto">Alterar foto de perfil</button>
        <button type="button" class="link-foto link-foto-remover oculto" id="btn-remover-foto">Remover foto</button>
      </div>
      <input type="file" id="input-foto" accept="image/*" class="oculto">
      <div class="perfil-email-linha">
        <h2 id="perfil-nome"></h2>
        <button type="button" class="btn-olho" id="btn-olho" aria-pressed="false" title="Ocultar dados sensíveis" aria-label="Ocultar dados sensíveis">
          <svg id="icone-olho" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <div class="grupo">
        <p class="grupo-titulo">Conta</p>
        <div class="lista-opcoes">
          <button type="button" class="linha" data-painel="painel-nome">
            <span class="linha-icone"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span class="linha-texto">Nome</span><span class="linha-valor" id="valor-nome"></span><span class="seta"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
          </button>
          <form id="painel-nome" class="painel oculto">
            <label for="novo-nome">Novo nome</label>
            <input type="text" id="novo-nome" required>
            <button type="submit">Salvar</button>
          </form>

          <button type="button" class="linha" data-painel="painel-email">
            <span class="linha-icone"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span><span class="linha-texto">E-mail</span><span class="linha-valor" id="valor-email"></span><span class="seta"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
          </button>
          <form id="painel-email" class="painel oculto">
            <label for="novo-email">Novo e-mail</label>
            <input type="email" id="novo-email" required>
            <button type="submit">Salvar</button>
          </form>

          <button type="button" class="linha" data-painel="painel-senha">
            <span class="linha-icone"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span><span class="linha-texto">Senha</span><span class="linha-valor">••••••</span><span class="seta"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
          </button>
          <form id="painel-senha" class="painel oculto">
            <label for="senha-atual">Senha atual</label>
            <input type="password" id="senha-atual" inputmode="numeric" maxlength="6" placeholder="000000">
            <label for="senha-nova">Nova senha (6 números)</label>
            <input type="password" id="senha-nova" inputmode="numeric" maxlength="6" placeholder="000000" required>
            <label for="senha-confirmar">Confirmar nova senha</label>
            <input type="password" id="senha-confirmar" inputmode="numeric" maxlength="6" placeholder="000000" required>
            <button type="submit">Salvar</button>
          </form>
        </div>
      </div>

      <div class="grupo grupo-destaque">
        <p class="grupo-titulo">Compartilhado</p>
        <div class="lista-opcoes">
          <a class="linha" href="espaco.html" id="link-espaco">
            <span class="linha-icone"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><span class="linha-texto">Espaço compartilhado</span><span class="linha-valor" id="valor-espaco"></span><span class="seta"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
          </a>
        </div>
      </div>
      <div class="grupo oculto" id="grupo-notificacoes">
        <p class="grupo-titulo">Notificações</p>
        <div class="lista-opcoes">
          <button type="button" class="linha" id="btn-push">
            <span class="linha-icone"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></span><span class="linha-texto">Notificações no aparelho</span><span class="linha-valor" id="valor-push"></span>
          </button>
          <button type="button" class="linha oculto" id="btn-push-teste">
            <span class="linha-icone"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg></span><span class="linha-texto">Enviar notificação de teste</span>
          </button>
        </div>
        <p class="dica-push oculto" id="dica-push"></p>
      </div>
      <div class="grupo">
        <p class="grupo-titulo">Aparência</p>

        <div class="lista-opcoes">
          <button type="button" class="linha" id="btn-temas" aria-expanded="false">
            <span class="linha-icone"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></span><span class="linha-texto">Temas recomendados</span><span class="linha-valor" id="valor-tema"></span><span class="seta"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
          </button>
          <div id="area-temas" class="area-cores oculto">
            <div class="temas" id="lista-temas"></div>
          </div>

          <button type="button" class="linha" id="btn-minhas-cores" aria-expanded="false">
            <span class="linha-icone"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.5-.7 1.5-1.5 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.8.7-1.5 1.5-1.5H16c3.3 0 6-2.7 6-6 0-4.9-4.5-9-10-9z"/></svg></span><span class="linha-texto">Personalize do seu jeito</span><span class="linha-valor"></span><span class="seta"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
          </button>
          <div id="area-cores" class="area-cores oculto">
          <label class="linha linha-cor">
            <span class="linha-icone"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></span><span class="linha-texto">Fundo</span><span class="linha-valor" id="hex-fundo"></span><input type="color" id="cor-fundo">
          </label>
          <label class="linha linha-cor">
            <span class="linha-icone"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="15" x2="21" y2="15"/></svg></span><span class="linha-texto">Barra do menu</span><span class="linha-valor" id="hex-menu"></span><input type="color" id="cor-menu">
          </label>
          <label class="linha linha-cor">
            <span class="linha-icone"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span><span class="linha-texto">Destaque</span><span class="linha-valor" id="hex-destaque"></span><input type="color" id="cor-destaque">
          </label>
          <label class="linha linha-cor">
            <span class="linha-icone"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg></span><span class="linha-texto">Letras</span><span class="linha-valor" id="hex-texto"></span><input type="color" id="cor-texto">
          </label>
          <button type="button" class="linha" id="btn-restaurar-cores">
            <span class="linha-icone"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></span><span class="linha-texto">Restaurar cores padrão</span>
          </button>
        </div>
        </div>
      </div>

      <div class="grupo">
        <p class="grupo-titulo">Ajuda</p>
        <div class="lista-opcoes">
          <button type="button" class="linha" id="btn-guia">
            <span class="linha-icone"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span><span class="linha-texto">Como usar o Dashvia</span><span class="seta"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
          </button>
          <button type="button" class="linha" id="btn-tour">
            <span class="linha-icone"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg></span><span class="linha-texto">Refazer o tour</span><span class="seta"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
          </button>
          <button type="button" class="linha" id="btn-novidades">
            <span class="linha-icone"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 3v4"/><path d="M17 5h4"/></svg></span><span class="linha-texto">Novidades</span><span class="seta"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
          </button>
          <button type="button" class="linha" id="btn-reporte">
            <span class="linha-icone"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg></span><span class="linha-texto">Reportar um problema</span><span class="seta"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
          </button>
        </div>
      </div>

      <div class="grupo">
        <p class="grupo-titulo">Sessão</p>
        <div class="lista-opcoes">
          <button type="button" class="linha sair" id="btn-sair">
            <span class="linha-icone"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span><span class="linha-texto">Sair da conta</span>
          </button>
          <button type="button" class="linha sair" id="btn-excluir">
            <span class="linha-icone"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></span><span class="linha-texto">Excluir minha conta</span>
          </button>
        </div>
      </div>
