<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste do Neon - Dashvia</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; background: #0d0a18; color: #eee; }
    h1 { font-size: 20px; }
    input { display: block; width: 100%; padding: 10px; margin: 6px 0 12px; border-radius: 8px; border: 1px solid #444; background: #1a1530; color: #fff; box-sizing: border-box; }
    button { padding: 10px 14px; margin: 4px 4px 4px 0; border-radius: 8px; border: 0; background: #7a4be0; color: #fff; cursor: pointer; }
    pre { background: #000; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; min-height: 120px; }
    small { color: #aaa; }
  </style>
</head>
<body>
  <h1>Teste do Neon (página só para testar, não publique)</h1>
  <small>Faça na ordem: 1 Criar conta, 2 Entrar, 3 Ver sessão, 4 Guardar perfil, 5 Inserir gasto, 6 Ler gastos.</small>

  <label>Nome</label>
  <input id="nome" value="Teste Dashvia">
  <label>E-mail</label>
  <input id="email" type="email" placeholder="seu-email-de-teste@exemplo.com">
  <label>Senha (mínimo 8 caracteres)</label>
  <input id="senha" type="password" placeholder="Teste1234">

  <button id="b-criar">1. Criar conta</button>
  <button id="b-entrar">2. Entrar</button>
  <button id="b-sessao">3. Ver sessão</button>
  <button id="b-perfil">4. Guardar perfil</button>
  <button id="b-inserir">5. Inserir gasto</button>
  <button id="b-ler">6. Ler gastos</button>
  <button id="b-sair">Sair</button>

  <h2>Resultado</h2>
  <pre id="saida">Aqui aparece o resultado de cada botão.</pre>

  <script src="../js/neon.bundle.js"></script>
  <script>
    const c = window.dashviaNeon;
    const saida = document.getElementById("saida");

    function mostrar(titulo, resposta) {
      const resumo = resposta && resposta.error
        ? { ERRO: resposta.error.message, codigo: resposta.error.code, status: resposta.error.status }
        : resposta;
      saida.textContent = "== " + titulo + " ==\n" + JSON.stringify(resumo, null, 2) + "\n\n" + saida.textContent;
    }

    async function usuarioDaSessao() {
      const s = await c.auth.getSession();
      return s.data && (s.data.user || (s.data.session && s.data.session.user)) || null;
    }

    function ligar(id, titulo, funcao) {
      document.getElementById(id).addEventListener("click", async function () {
        try {
          mostrar(titulo, await funcao());
        } catch (falha) {
          mostrar(titulo + " (falhou)", { ERRO: String(falha && falha.message || falha) });
        }
      });
    }

    const valor = function (id) { return document.getElementById(id).value.trim(); };

    ligar("b-criar", "Criar conta", function () {
      return c.auth.signUp.email({ email: valor("email"), password: valor("senha"), name: valor("nome") });
    });
    ligar("b-entrar", "Entrar", function () {
      return c.auth.signIn.email({ email: valor("email"), password: valor("senha") });
    });
    ligar("b-sessao", "Sessão", usuarioDaSessao);
    ligar("b-perfil", "Guardar perfil", async function () {
      const u = await usuarioDaSessao();
      if (!u) return { ERRO: "Entre primeiro (botão 2)" };
      return c.from("perfis").upsert({ id: u.id, nome: valor("nome") }).select();
    });
    ligar("b-inserir", "Inserir gasto", function () {
      return c.from("gastos").insert({
        plataforma: "Teste", categoria: "Outros", parcelas: "avista",
        data: "2026-10-06", valor: 1.5, banco: "Outro"
      }).select();
    });
    ligar("b-ler", "Gastos", function () { return c.from("gastos").select("*"); });
    ligar("b-sair", "Sair", function () { return c.auth.signOut(); });
  </script>
</body>
</html>
