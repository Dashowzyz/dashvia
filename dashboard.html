    <header>
      <h1>Dashboard</h1>
      <p id="saudacao"></p>
    </header>

    <div class="cards-topo">
      <p id="titulo-cards" class="titulo-cards"></p>
      <button type="button" class="btn-personalizar" id="btn-personalizar" aria-label="Escolher os blocos do topo" title="Escolher os blocos do topo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
        <span class="btn-texto">Personalizar</span>
      </button>
    </div>

    <div class="cards-area">
      <button type="button" class="cards-seta cards-seta-esq" id="cards-anterior" aria-label="Blocos anteriores" title="Anteriores" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <section id="cards" class="cards"></section>
      <button type="button" class="cards-seta cards-seta-dir" id="cards-proximo" aria-label="Próximos blocos" title="Próximos" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <div id="pontos-cards" class="pontos"></div>

    <section class="bloco">
      <h2>Histórico de transação</h2>
      <p class="legenda">Últimos registros</p>
      <ul id="historico" class="historico"></ul>
    </section>

    <section class="bloco">
      <h2>Resumo</h2>
      <p class="legenda">Próximos 12 meses</p>
      <div id="grafico" class="grafico"></div>
    </section>
